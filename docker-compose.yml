services:
  app:
    build: .
    container_name: devin-autofix
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Public tunnel so GitHub webhooks can reach the local engine.
  # Optional: only needed for the live webhook trigger. Set NGROK_AUTHTOKEN in .env.
  # Inspect the public URL at http://localhost:4040 once running.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: devin-autofix-ngrok
    command: http app:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["webhook"]
